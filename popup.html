<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { width: 360px; padding: 15px; font-family: system-ui, sans-serif; }
    label { display: block; margin: 12px 0 6px; font-weight: bold; }
    input, select, textarea { 
      width: 100%; 
      padding: 8px; 
      box-sizing: border-box; 
      font-size: 14px; 
    }
    textarea { height: 60px; resize: vertical; }
    button { margin: 15px 8px 0 0; padding: 10px 16px; font-size: 14px; }
    .status { 
      margin-top: 15px; 
      padding: 12px; 
      border-radius: 6px; 
      font-size: 14px; 
      line-height: 1.5;
      white-space: pre-line;
      overflow-wrap: anywhere;
    }
    .enabled  { background: #d4edda; color: #155724; }
    .disabled { background: #f8d7da; color: #721c24; }
    .block-option { display: flex; align-items: center; gap: 8px; font-weight: normal; }
    .block-option input { width: auto; }
    .hint { font-size: 12px; color: #555; line-height: 1.5; }
  </style>
</head>
<body>
  <h2>Proxy 设置器</h2>

  <label>协议类型</label>
  <select id="scheme">
    <option value="socks5">SOCKS5</option>
    <option value="http">HTTP 代理（可转发 HTTPS 网站）</option>
  </select>

  <label>代理地址 (Host)</label>
  <input type="text" id="host" placeholder="192.168.100.1 或 proxy.example.com">

  <label>端口 (Port)</label>
  <input type="number" id="port" placeholder="7896" min="1" max="65535" step="1">

  <label>节点备注（方便识别）</label>
  <textarea id="note" placeholder="这是翻墙节点"></textarea>

  <label class="block-option">
    <input type="checkbox" id="blockWhenDisabled" disabled>
    禁用时断网，禁止直连
  </label>
  <div class="hint">选中后立即保存；禁用代理时阻断新的网页网络请求。重新启用代理可恢复。
    不切断系统网络或已有连接，WebRTC 等流量不保证覆盖；扩展本身必须保持启用。</div>

  <div>
    <button id="save" disabled>保存并启用</button>
    <button id="disable" disabled>禁用代理</button>
  </div>

  <div class="status" id="status"></div>

  <script src="validation.js"></script>
  <script src="popup.js"></script>
</body>
</html>
